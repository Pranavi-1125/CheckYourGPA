<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate SGPA</title>
    <link rel="stylesheet" href="SGPA.css">
</head>
<body>
    <nav>
        <h1>Want to check your GPA?</h1>
    </nav>
    <p>Calculate SGPA</p>
    <div id="container">
        <table>
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Credit</th>
                    <th>Grade</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="subjectTableBody">
                <tr>
                    <td><input class="subject-input" type="text" name="subject" placeholder="Subject"></td>
                    <td><input class="credit-input" type="number" name="credit" min="1" max="4" placeholder="Credit"></td>
                    <td><select class="grade-input" name="grade">
                        <option value="O">O</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="E">E</option>
                    </select></td>
                    <td><button id="deleteBtn" type="button" onclick="DeleteRow(this)">Delete</button></td>
                </tr>
            </tbody>
        </table>
        <button type="button" id="addSubject" onclick="addRow()">+ Add Subject</button>
    </div>

    
    <button id="calculateBtn" type="submit" onclick="calculateSGPA()">Calculate SGPA</button>
    <p id="result"></p>
<p>Calculate CGPA</p>

<div id="cgpaContainer">
    <table>
        <thead>
            <tr>
                <th>Semester</th>
                <th>SGPA</th>
                <th>Total Credits</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="semesterTableBody">
            <tr>
                <td>Semester 1</td>
                <td>
                    <input 
                        class="sgpa-input" 
                        type="number" 
                        step="0.01" 
                        min="0" 
                        max="10" 
                        placeholder="SGPA"
                    >
                </td>
                <td>
                    <input 
                        class="semester-credit-input" 
                        type="number" 
                        min="1" 
                        placeholder="Credits"
                    >
                </td>
                <td>
                    <button type="button" id="deleteBtn" onclick="deleteSemester(this)">
                        Delete
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <button type="button" id="addSemester">
        + Add Semester
    </button>
</div>

<button id="calculateCGPABtn" type="button">
    Calculate CGPA
</button>

<p id="cgpaResult"></p>
    <script src="SGPA.js"></script>
</body>
</html>
